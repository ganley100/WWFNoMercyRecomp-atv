plugins {
    id "com.android.application"
}

android {
    namespace "com.nomercyrecomp.atv"
    compileSdk 34

    defaultConfig {
        minSdk 28          // Android TV 9+ (aligned_alloc, Vulkan 1.1 for RT64)
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        ndk { abiFilters "arm64-v8a" }
    }

    // One installable app per game: each flavor has its own package id, name,
    // launcher banner/icon and native library, so both can sit side by side
    // on the Android TV home screen.
    flavorDimensions "game"
    productFlavors {
        nomercy {
            dimension "game"
            applicationId "com.nomercyrecomp.nomercy"
            resValue "string", "app_name", "WWF No Mercy"
            buildConfigField "String", "GAME_ID", "\"nomercy\""
            buildConfigField "String", "NATIVE_LIB", "\"NoMercyRecompiled\""
        }
        ecw {
            dimension "game"
            applicationId "com.nomercyrecomp.ecw"
            resValue "string", "app_name", "ECW Born to be Wired"
            buildConfigField "String", "GAME_ID", "\"ecw\""
            buildConfigField "String", "NATIVE_LIB", "\"ECWRecompiled\""
        }
    }

    buildFeatures { buildConfig true }

    // The engine's UI files, fonts, bundled mods and controller database are
    // packed under assets/game/ and unpacked to internal storage on first run.
    sourceSets {
        main.assets.srcDirs += layout.buildDirectory.dir("generated/gameAssets")
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true } // engine maps its .so files directly
    }

    buildTypes {
        release {
            minifyEnabled false
            // Debug-signed so a release APK can be sideloaded straight away;
            // swap in your own keystore before distributing.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Copy the repo's runtime assets into the APK (see GameActivity.unpackGameAssets).
def copyGameAssets = tasks.register("copyGameAssets", Copy) {
    from(rootProject.file("../assets")) { into "game/assets" }
    from(rootProject.file("../recompcontrollerdb.txt")) { into "game" }
    into layout.buildDirectory.dir("generated/gameAssets")
}
tasks.named("preBuild") { dependsOn copyGameAssets }
